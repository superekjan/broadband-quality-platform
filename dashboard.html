<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 光宽质差感知自智平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-primary: #030712;
            --bg-secondary: #0a1628;
            --bg-card: rgba(10, 22, 40, 0.9);
            --border-color: rgba(0, 200, 255, 0.12);
            --text-primary: #e8f4ff;
            --text-secondary: #7aa2cc;
            --text-muted: #4a6a8a;
            --accent-cyan: #00d4ff;
            --accent-blue: #0088ff;
            --accent-purple: #a855f7;
            --accent-green: #00ff88;
            --accent-yellow: #ffd000;
            --accent-red: #ff3366;
            --glow-cyan: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 136, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .screen-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-rows: 1fr;
            z-index: 1;
        }

        .main-content {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }

        .left-panel, .center-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            opacity: 0.8;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .panel-title-icon svg {
            width: 16px;
            height: 16px;
            stroke-width: 1.5;
            fill: none;
        }

        .icon-trend svg { stroke: var(--accent-cyan); }
        .icon-probe svg { stroke: var(--accent-purple); }
        .icon-city svg { stroke: var(--accent-green); }
        .icon-daily svg { stroke: var(--accent-cyan); }
        .icon-weekly svg { stroke: var(--accent-purple); }
        .icon-monthly svg { stroke: var(--accent-green); }

        .chart-container {
            width: 100%;
            min-height: 0;
            flex: 1;
        }

        .map-container {
            flex: 2.5;
            min-height: 0;
            position: relative;
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
        }

        .map-container::before {
            display: none;
        }

        #guangdongMap {
            width: 100%; height: 100%;
        }

        .footer-bar {
            height: 36px;
            background: rgba(10, 22, 40, 0.9);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 11px; color: var(--text-muted);
        }

        .footer-left, .footer-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        @media (max-width: 1400px) {
            .main-content { grid-template-columns: 280px 1fr 280px; }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <div class="screen-grid">
        <div class="main-content">
            <div class="left-panel">
                <div class="panel-card">
                    <div class="panel-title">
                        <div class="panel-title-icon icon-trend">
                            <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
                        </div>
                        全省不可用时长趋势
                    </div>
                    <div class="chart-container" id="trendChart"></div>
                </div>

                <div class="panel-card">
                    <div class="panel-title">
                        <div class="panel-title-icon icon-probe">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        </div>
                        探针分布
                    </div>
                    <div class="chart-container" id="probePieChart"></div>
                </div>
            </div>

            <div class="center-panel">
                <div class="map-container">
                    <div id="guangdongMap"></div>
                </div>

                <div class="panel-card">
                    <div class="panel-title">
                        <div class="panel-title-icon icon-city">
                            <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
                        </div>
                        地市不可用时长统计
                    </div>
                    <div class="chart-container" id="cityBarChart"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel-card">
                    <div class="panel-title">
                        <div class="panel-title-icon icon-daily">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </div>
                        日自智触发统计
                    </div>
                    <div class="chart-container" id="dailyChart"></div>
                </div>

                <div class="panel-card">
                    <div class="panel-title">
                        <div class="panel-title-icon icon-weekly">
                            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        </div>
                        周自智触发统计
                    </div>
                    <div class="chart-container" id="weeklyChart"></div>
                </div>

                <div class="panel-card">
                    <div class="panel-title">
                        <div class="panel-title-icon icon-monthly">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
                        </div>
                        月自智触发统计
                    </div>
                    <div class="chart-container" id="monthlyChart"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var hunanMapChart = echarts.init(document.getElementById('guangdongMap'));
            fetch('components/430000_full.json')
                .then(function(response) { return response.json(); })
                .then(function(geoJson) {
                    echarts.registerMap('湖南', geoJson);

                    var hnCityData = [
                        { name: '长沙市', value: 89 },
                        { name: '株洲市', value: 85 },
                        { name: '湘潭市', value: 86 },
                        { name: '衡阳市', value: 82 },
                        { name: '邵阳市', value: 78 },
                        { name: '岳阳市', value: 84 },
                        { name: '常德市', value: 83 },
                        { name: '张家界市', value: 80 },
                        { name: '益阳市', value: 79 },
                        { name: '郴州市', value: 81 },
                        { name: '永州市', value: 77 },
                        { name: '怀化市', value: 75 },
                        { name: '娄底市', value: 76 },
                        { name: '湘西土家族苗族自治州', value: 73 }
                    ];

                    var mapOption = {
                        backgroundColor: 'transparent',
                        tooltip: {
                            trigger: 'item',
                            backgroundColor: 'rgba(10, 22, 40, 0.95)',
                            borderColor: 'rgba(0, 212, 255, 0.3)',
                            textStyle: { color: '#e8f4ff', fontSize: 13 },
                            formatter: function(params) {
                                if (params.value !== undefined) {
                                    var score = params.value;
                                    var level = score >= 85 ? '优' : score >= 70 ? '良' : '差';
                                    var levelColor = score >= 85 ? '#00d4ff' : score >= 70 ? '#4a9eff' : '#2a5a8a';
                                    return '<strong>' + params.name + '</strong><br/>QoE分值：<span style="color:' + levelColor + ';font-weight:bold;font-size:16px;">' + score.toFixed(1) + '</span><br/><span style="color:#7aa2cc;font-size:11px;">评级：' + level + '</span>';
                                }
                                return params.name;
                            }
                        },
                        visualMap: {
                            show: true,
                            min: 0,
                            max: 100,
                            orient: 'horizontal',
                            left: 20,
                            bottom: 10,
                            text: ['优', '差'],
                            textStyle: { color: '#7aa2cc', fontSize: 11 },
                            inRange: {
                                color: ['#0d2a4a', '#0a4080', '#0060b0', '#0080d0', '#00a0f0', '#00d4ff']
                            },
                            itemWidth: 10,
                            itemHeight: 80,
                            calculable: false
                        },
                        series: [{
                            name: 'QoE感知评分',
                            type: 'map',
                            map: '湖南',
                            roam: true,
                            zoom: 1.1,
                            center: [112.0, 27.5],
                            label: {
                                show: true,
                                color: '#FFFFFF',
                                fontSize: 10,
                                formatter: function(params) {
                                    return params.name.replace('市', '').replace('土家族苗族自治州', '');
                                },
                                textShadowColor: 'rgba(0, 0, 0, 0.8)',
                                textShadowBlur: 5,
                                textShadowOffsetX: 2,
                                textShadowOffsetY: 2
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    color: '#fff',
                                    fontSize: 14,
                                    fontWeight: 'bold'
                                },
                                itemStyle: {
                                    areaColor: '#0055aa',
                                    shadowBlur: 15,
                                    shadowColor: 'rgba(0, 150, 255, 0.4)'
                                }
                            },
                            itemStyle: {
                                borderColor: 'rgba(0, 212, 255, 0.25)',
                                borderWidth: 1,
                                areaColor: '#0a2040'
                            },
                            data: hnCityData
                        }]
                    };
                    hunanMapChart.setOption(mapOption);

                    window.addEventListener('resize', function() {
                        hunanMapChart.resize();
                    });
                });

            var trendChart = echarts.init(document.getElementById('trendChart'));
            var trendOption = {
                backgroundColor: 'transparent',
                grid: { left: 48, right: 16, top: 16, bottom: 28 },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(10, 22, 40, 0.95)',
                    borderColor: 'rgba(0, 212, 255, 0.3)',
                    textStyle: { color: '#e8f4ff', fontSize: 12 },
                    formatter: function(params) {
                        return params[0].name + '<br/><span style="color:#00d4ff;font-weight:bold;">' + params[0].value + '</span> 小时';
                    }
                },
                xAxis: {
                    type: 'category',
                    data: ['2025-12', '2026-01', '2026-02', '2026-03', '2026-04', '2026-05'],
                    axisLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.15)' } },
                    axisLabel: { color: '#4a6a8a', fontSize: 10 }
                },
                yAxis: {
                    type: 'value',
                    name: 'h',
                    nameTextStyle: { color: '#4a6a8a', fontSize: 10 },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.08)' } },
                    axisLabel: { color: '#4a6a8a', fontSize: 10 }
                },
                series: [{
                    type: 'line',
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 5,
                    lineStyle: { color: '#00d4ff', width: 2 },
                    itemStyle: { color: '#00d4ff', borderColor: '#050810', borderWidth: 2 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(0, 212, 255, 0.25)' },
                            { offset: 1, color: 'rgba(0, 212, 255, 0.02)' }
                        ])
                    },
                    data: [1250, 1180, 1320, 1090, 1150, 980]
                }]
            };
            trendChart.setOption(trendOption);

            var probePieChart = echarts.init(document.getElementById('probePieChart'));
            var probePieOption = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(10, 22, 40, 0.95)',
                    borderColor: 'rgba(0, 212, 255, 0.3)',
                    textStyle: { color: '#e8f4ff', fontSize: 12 },
                    formatter: '{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'horizontal',
                    bottom: 15,
                    left: 'center',
                    textStyle: { color: '#7aa2cc', fontSize: 9 },
                    itemWidth: 8,
                    itemHeight: 8,
                    itemGap: 6
                },
                series: [{
                    type: 'pie',
                    radius: ['35%', '60%'],
                    center: ['50%', '35%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 4,
                        borderColor: '#0a0f1a',
                        borderWidth: 1
                    },
                    label: { show: false },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 12,
                            fontWeight: 'bold',
                            color: '#e8f4ff'
                        }
                    },
                    data: [
                        { value: 285, name: '长沙', itemStyle: { color: '#00d4ff' } },
                        { value: 198, name: '株洲', itemStyle: { color: '#0088ff' } },
                        { value: 156, name: '湘潭', itemStyle: { color: '#a855f7' } },
                        { value: 142, name: '衡阳', itemStyle: { color: '#00ff88' } },
                        { value: 128, name: '邵阳', itemStyle: { color: '#ffd000' } },
                        { value: 118, name: '岳阳', itemStyle: { color: '#ff6b6b' } },
                        { value: 105, name: '常德', itemStyle: { color: '#4ecdc4' } },
                        { value: 110, name: '郴州', itemStyle: { color: '#ffeaa7' } },
                        { value: 102, name: '永州', itemStyle: { color: '#dfe6e9' } },
                        { value: 95, name: '益阳', itemStyle: { color: '#96ceb4' } },
                        { value: 96, name: '娄底', itemStyle: { color: '#6c5ce7' } },
                        { value: 89, name: '张家界', itemStyle: { color: '#45b7d1' } },
                        { value: 88, name: '怀化', itemStyle: { color: '#fd79a8' } },
                        { value: 78, name: '湘西', itemStyle: { color: '#55a3e8' } }
                    ]
                }]
            };
            probePieChart.setOption(probePieOption);

            var cityBarChart = echarts.init(document.getElementById('cityBarChart'));
            var cityData = [
                { name: '长沙', value: 326 },
                { name: '株洲', value: 285 },
                { name: '湘潭', value: 268 },
                { name: '衡阳', value: 245 },
                { name: '岳阳', value: 218 },
                { name: '常德', value: 196 },
                { name: '邵阳', value: 182 },
                { name: '郴州', value: 165 },
                { name: '永州', value: 152 },
                { name: '益阳', value: 138 },
                { name: '娄底', value: 125 },
                { name: '怀化', value: 108 },
                { name: '张家界', value: 92 },
                { name: '湘西', value: 78 }
            ];
            var cityBarOption = {
                backgroundColor: 'transparent',
                grid: { left: 48, right: 16, top: 8, bottom: 24 },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(10, 22, 40, 0.95)',
                    borderColor: 'rgba(0, 212, 255, 0.3)',
                    textStyle: { color: '#e8f4ff', fontSize: 12 },
                    formatter: function(params) {
                        return params[0].name + '<br/><span style="color:#00d4ff;font-weight:bold;">' + params[0].value + '</span> 小时';
                    }
                },
                dataZoom: [{
                    type: 'inside',
                    xAxisIndex: 0,
                    startValue: 0,
                    endValue: 13
                }],
                xAxis: {
                    type: 'category',
                    data: cityData.map(function(d) { return d.name; }),
                    axisLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.15)' } },
                    axisLabel: { color: '#4a6a8a', fontSize: 9, interval: 0, rotate: 45 }
                },
                yAxis: {
                    type: 'value',
                    name: 'h',
                    nameTextStyle: { color: '#4a6a8a', fontSize: 10 },
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.08)' } },
                    axisLabel: { color: '#4a6a8a', fontSize: 10 }
                },
                series: [{
                    type: 'bar',
                    barWidth: '55%',
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#00d4ff' },
                            { offset: 1, color: '#004488' }
                        ]),
                        borderRadius: [3, 3, 0, 0]
                    },
                    emphasis: {
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#33e0ff' },
                                { offset: 1, color: '#0066bb' }
                            ])
                        }
                    },
                    data: cityData.map(function(d) { return d.value; })
                }]
            };
            cityBarChart.setOption(cityBarOption);

            function createAutoChart(id, data, colors) {
                var chart = echarts.init(document.getElementById(id));
                var option = {
                    backgroundColor: 'transparent',
                    grid: { left: 40, right: 12, top: 24, bottom: 24 },
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(10, 22, 40, 0.95)',
                        borderColor: 'rgba(0, 212, 255, 0.3)',
                        textStyle: { color: '#e8f4ff', fontSize: 12 },
                        formatter: function(params) {
                            var res = params[0].name + '<br/>';
                            params.forEach(function(p) {
                                res += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + p.color + ';margin-right:6px;"></span>' + p.seriesName + ': <span style="color:#00d4ff;font-weight:bold;">' + p.value + '</span><br/>';
                            });
                            return res;
                        }
                    },
                    legend: {
                        top: 0,
                        right: 0,
                        textStyle: { color: '#7aa2cc', fontSize: 9 },
                        itemWidth: 8,
                        itemHeight: 8,
                        itemGap: 8
                    },
                    xAxis: {
                        type: 'category',
                        data: data.categories,
                        axisLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.15)' } },
                        axisLabel: { color: '#4a6a8a', fontSize: 9 }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { show: false },
                        axisTick: { show: false },
                        splitLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.08)' } },
                        axisLabel: { color: '#4a6a8a', fontSize: 9 }
                    },
                    series: [
                        {
                            name: '路由自智',
                            type: 'bar',
                            barWidth: '22%',
                            barGap: '15%',
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: colors[0] },
                                    { offset: 1, color: colors[0] + '44' }
                                ]),
                                borderRadius: [2, 2, 0, 0]
                            },
                            data: data.route
                        },
                        {
                            name: 'DNS自智',
                            type: 'bar',
                            barWidth: '22%',
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: colors[1] },
                                    { offset: 1, color: colors[1] + '44' }
                                ]),
                                borderRadius: [2, 2, 0, 0]
                            },
                            data: data.dns
                        },
                        {
                            name: 'QoS自智',
                            type: 'bar',
                            barWidth: '22%',
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: colors[2] },
                                    { offset: 1, color: colors[2] + '44' }
                                ]),
                                borderRadius: [2, 2, 0, 0]
                            },
                            data: data.qos
                        }
                    ]
                };
                chart.setOption(option);
                return chart;
            }

            var dailyChart = createAutoChart('dailyChart', {
                categories: ['00-04', '04-08', '08-12', '12-16', '16-20', '20-24'],
                route: [12, 8, 35, 42, 38, 25],
                dns: [5, 3, 18, 22, 20, 12],
                qos: [3, 2, 10, 15, 12, 8]
            }, ['#00d4ff', '#a855f7', '#00ff88']);

            var weeklyChart = createAutoChart('weeklyChart', {
                categories: ['05-03', '05-10', '05-17', '05-24', '05-31'],
                route: [78, 95, 88, 45, 38],
                dns: [38, 52, 45, 22, 18],
                qos: [25, 35, 30, 15, 12]
            }, ['#00d4ff', '#a855f7', '#00ff88']);

            var monthlyChart = createAutoChart('monthlyChart', {
                categories: ['1月', '2月', '3月', '4月', '5月', '6月'],
                route: [320, 285, 350, 310, 295, 268],
                dns: [165, 148, 180, 158, 152, 138],
                qos: [110, 98, 125, 105, 100, 88]
            }, ['#00d4ff', '#a855f7', '#00ff88']);

            window.addEventListener('resize', function() {
                trendChart.resize();
                probePieChart.resize();
                cityBarChart.resize();
                dailyChart.resize();
                weeklyChart.resize();
