<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试目标 - 光宽质差感知自智平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <script src="components/table-component.js"></script>
</head>
<body>
    <div class="page-header">
        <div>
            <div class="page-title">测试目标</div>
            <div class="page-subtitle">管理网络测试目标配置</div>
        </div>
        <div class="header-actions">
            <button class="btn">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出数据
            </button>
            <button class="btn btn-primary">
                <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                新增
            </button>
        </div>
    </div>

    <div class="search-bar">
        <div class="search-input">
            <input type="text" placeholder="测试地址">
        </div>
        <div class="search-input">
            <input type="text" placeholder="目标名称">
        </div>
        <div class="search-input">
            <select class="search-select">
                <option value="">测试类型</option>
                <option value="web">网页</option>
                <option value="ping">PING</option>
                <option value="ipv6">IPv6</option>
                <option value="video">视频</option>
                <option value="game">游戏</option>
            </select>
        </div>
        <div class="search-input">
            <input type="text" placeholder="任务说明">
        </div>
    </div>

    <div class="card">
        <div id="targets-table" class="table-container"></div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">新增测试目标</div>
                <button class="modal-close" onclick="closeModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="addForm">
                <div class="form-group">
                    <label class="form-label">目标名称</label>
                    <input type="text" class="form-input" placeholder="请输入目标名称">
                </div>
                <div class="form-group">
                    <label class="form-label">IP地址</label>
                    <input type="text" class="form-input" placeholder="请输入IP地址">
                </div>
                <div class="form-group">
                    <label class="form-label">类型</label>
                    <select class="form-input">
                        <option value="web">网页</option>
                        <option value="ping">PING</option>
                        <option value="ipv6">IPv6</option>
                        <option value="video">视频</option>
                        <option value="game">游戏</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">端口</label>
                    <input type="number" class="form-input" placeholder="请输入端口号">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">确认添加</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 测试目标数据
        const targetsData = [
            { id: 1, name: '测试目标1', type: 'http', url: 'b01.****.com', desc: '-' },
            { id: 2, name: '测试目标2', type: 'http', url: 'b01-data-reported.****com', desc: '-' },
            { id: 3, name: '测试目标3', type: 'http', url: 'b01datacollect.****.com', desc: '-' }
        ];

        // 初始化测试目标表格
        const targetsTable = new DataTable('targets-table', {
            minWidth: 800,
            pageSize: 5,
            columns: [
                { key: 'id', label: '目标ID', flex: 0.8 },
                { key: 'name', label: '目标名称', flex: 1.5 },
                { key: 'type', label: '测试类型', flex: 1, render: (val) => `<span class="type-badge">${val}</span>` },
                { key: 'url', label: '测试地址', flex: 2 },
                { key: 'desc', label: '任务说明', flex: 1 },
                { key: 'actions', label: '操作', flex: 1, render: () => `<div class="action-links"><a href="#" style="color: var(--accent-cyan); text-decoration: none; font-size: 13px;">修改</a><a href="#" style="color: var(--accent-red); text-decoration: none; font-size: 13px;">删除</a></div>` }
            ],
            data: targetsData
        });
        targetsTable.render();

        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('addModal').classList.remove('show');
        }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('测试目标添加成功');
            closeModal();
        });
    </script>
</body>
</html>
