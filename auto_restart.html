<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端自智 - 光宽质差感知自智平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="components/table-component.js"></script>
    <style>
        .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin: -24px -24px 20px -24px;
            padding: 0 24px;
        }
        .tab-btn {
            padding: 14px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.05);
        }
        .tab-btn.active {
            color: var(--accent-cyan);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            border-radius: 1px;
        }
        .tab-btn .tab-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tab-btn .tab-count {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.1);
            color: var(--text-secondary);
            font-weight: 600;
        }
        .tab-btn.active .tab-count {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-cyan);
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .tab-search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab-search-bar .search-input {
            flex: 1;
            min-width: 140px;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div>
            <div class="page-title">终端自智</div>
            <div class="page-subtitle">自智智能维护策略管理</div>
        </div>
        <div class="header-actions">
            <button class="btn">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出数据
            </button>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon warning">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">234</div>
                <div class="stat-label">触发重启用户数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">198</div>
                <div class="stat-label">已下发用户数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon info">
                <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">156</div>
                <div class="stat-label">拦截成功用户</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">78.8%</div>
                <div class="stat-label">拦截成功率</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="tab-header">
            <button class="tab-btn active" data-tab="dispatch" onclick="switchTab('dispatch')">
                <svg class="tab-icon" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                下发用户清单
                <span class="tab-count">7</span>
            </button>
            <button class="tab-btn" data-tab="block" onclick="switchTab('block')">
                <svg class="tab-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                拦截证明
                <span class="tab-count">7</span>
            </button>
        </div>
        <div class="tab-pane active" id="tab-dispatch">
            <div class="tab-search-bar">
                <div class="search-input">
                    <input type="text" placeholder="搜索账号">
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部地市</option>
                        <option value="changsha">长沙</option>
                        <option value="zhuzhou">株洲</option>
                        <option value="xiangtan">湘潭</option>
                        <option value="hengyang">衡阳</option>
                        <option value="shaoyang">邵阳</option>
                        <option value="yueyang">岳阳</option>
                        <option value="changde">常德</option>
                        <option value="zhangjiajie">张家界</option>
                    </select>
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部状态</option>
                        <option value="success">已生效</option>
                        <option value="pending">待生效</option>
                        <option value="failed">失败</option>
                    </select>
                </div>
            </div>
            <div id="dispatch-table" class="table-container"></div>
        </div>
        <div class="tab-pane" id="tab-block">
            <div class="tab-search-bar">
                <div class="search-input">
                    <input type="text" placeholder="搜索账号">
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部地市</option>
                        <option value="changsha">长沙</option>
                        <option value="zhuzhou">株洲</option>
                        <option value="xiangtan">湘潭</option>
                        <option value="hengyang">衡阳</option>
                        <option value="shaoyang">邵阳</option>
                        <option value="yueyang">岳阳</option>
                        <option value="changde">常德</option>
                        <option value="zhangjiajie">张家界</option>
                    </select>
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部拦截类型</option>
                        <option value="dns">DNS拦截</option>
                        <option value="route">路由拦截</option>
                        <option value="qos">QoS拦截</option>
                    </select>
                </div>
            </div>
            <div id="block-table" class="table-container"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        const dispatchData = [
            { account: '18062790651', city: '长沙', triggerTime: '2026-05-31 14:23:15', dispatchTime: '2026-05-31 14:25:30', status: '已生效', result: '成功' },
            { account: '07319541859', city: '株洲', triggerTime: '2026-05-31 13:05:42', dispatchTime: '2026-05-31 13:08:00', status: '已生效', result: '成功' },
            { account: '17371214159', city: '湘潭', triggerTime: '2026-05-31 11:30:00', dispatchTime: '2026-05-31 11:32:15', status: '已生效', result: '成功' },
            { account: '07349546950', city: '衡阳', triggerTime: '2026-05-31 10:12:28', dispatchTime: '2026-05-31 10:15:00', status: '已生效', result: '成功' },
            { account: '18673153692', city: '岳阳', triggerTime: '2026-05-31 09:45:10', dispatchTime: '2026-05-31 09:48:22', status: '已生效', result: '成功' },
            { account: '07386223005', city: '常德', triggerTime: '2026-05-31 08:20:33', dispatchTime: '2026-05-31 08:23:45', status: '已生效', result: '成功' },
            { account: '18974327899', city: '张家界', triggerTime: '2026-05-31 07:55:00', dispatchTime: '2026-05-31 07:58:12', status: '已生效', result: '成功' }
        ];

        const dispatchTable = new DataTable('dispatch-table', {
            minWidth: 900,
            pageSize: 5,
            columns: [
                { key: 'account', label: '账号', flex: 1.3, render: (val) => `<span style="font-family: 'JetBrains Mono', monospace;">${val}</span>` },
                { key: 'city', label: '地市', flex: 0.8 },
                { key: 'triggerTime', label: '触发时间', flex: 1.4 },
                { key: 'dispatchTime', label: '下发时间', flex: 1.4 },
                { key: 'status', label: '状态', flex: 0.9, render: (val) => `<span class="status-badge online"><span class="status-dot"></span>${val}</span>` },
                { key: 'result', label: '结果', flex: 0.8, render: (val) => `<span style="color: #00ff88; font-weight: 600;">${val}</span>` }
            ],
            data: dispatchData
        });
        dispatchTable.render();

        const blockData = [
            { account: '18062790651', city: '长沙', blockTime: '2026-05-31 14:25:35', blockType: '路由拦截', blockResult: '成功', recoverTime: '2026-05-31 14:30:00', duration: 265 },
            { account: '07319541859', city: '株洲', blockTime: '2026-05-31 13:08:05', blockType: 'DNS拦截', blockResult: '成功', recoverTime: '2026-05-31 13:12:20', duration: 255 },
            { account: '17371214159', city: '湘潭', blockTime: '2026-05-31 11:32:20', blockType: '路由拦截', blockResult: '成功', recoverTime: '2026-05-31 11:38:00', duration: 340 },
            { account: '07349546950', city: '衡阳', blockTime: '2026-05-31 10:15:05', blockType: 'QoS拦截', blockResult: '成功', recoverTime: '2026-05-31 10:20:30', duration: 325 },
            { account: '18673153692', city: '岳阳', blockTime: '2026-05-31 09:48:28', blockType: '路由拦截', blockResult: '成功', recoverTime: '2026-05-31 09:53:15', duration: 287 },
            { account: '07386223005', city: '常德', blockTime: '2026-05-31 08:23:50', blockType: 'DNS拦截', blockResult: '成功', recoverTime: '2026-05-31 08:28:40', duration: 290 },
            { account: '18974327899', city: '张家界', blockTime: '2026-05-31 07:58:18', blockType: '路由拦截', blockResult: '成功', recoverTime: '2026-05-31 08:05:00', duration: 402 }
        ];

        const blockTable = new DataTable('block-table', {
            minWidth: 1000,
            pageSize: 5,
            columns: [
                { key: 'account', label: '账号', flex: 1.3, render: (val) => `<span style="font-family: 'JetBrains Mono', monospace;">${val}</span>` },
                { key: 'city', label: '地市', flex: 0.8 },
                { key: 'blockTime', label: '拦截时间', flex: 1.3 },
                { key: 'blockType', label: '拦截类型', flex: 1.0 },
                { key: 'blockResult', label: '拦截结果', flex: 0.9, render: (val) => `<span class="status-badge online"><span class="status-dot"></span>${val}</span>` },
                { key: 'recoverTime', label: '恢复时间', flex: 1.3 },
                { key: 'duration', label: '持续时长(秒)', flex: 1.0, render: (val) => `<span style="color: #00d4ff; font-weight: 600;">${val}</span>` }
            ],
            data: blockData
        });
        blockTable.render();
    </script>
</body>
</html>
