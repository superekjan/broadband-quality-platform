<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不可用时长 - 光宽质差感知自智平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="components/table-component.js"></script>
    <style>
        .card-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .card-section-title .title-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
        }
        .card-section-title .title-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin: -24px -24px 20px -24px;
            padding: 0 24px;
        }
        .tab-btn {
            padding: 14px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.05);
        }
        .tab-btn.active {
            color: var(--accent-cyan);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            border-radius: 1px;
        }
        .tab-btn .tab-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tab-btn .tab-count {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.1);
            color: var(--text-secondary);
            font-weight: 600;
        }
        .tab-btn.active .tab-count {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-cyan);
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .tab-search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab-search-bar .search-input {
            flex: 1;
            min-width: 140px;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div>
            <div class="page-title">不可用时长</div>
            <div class="page-subtitle">监测用户中断情况与策略下发有效性验证</div>
        </div>
        <div class="header-actions">
            <button class="btn">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出数据
            </button>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon warning">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">126</div>
                <div class="stat-label">中断用户数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon danger">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">4,285</div>
                <div class="stat-label">总不可用时长(分钟)</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">89</div>
                <div class="stat-label">已策略下发用户</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon info">
                <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">37</div>
                <div class="stat-label">Ping不可达用户</div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
        <div class="card-section-title">
            <span class="title-dot"></span>
            <svg class="title-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            不可用时长监测
        </div>
        <div id="unavailable-trend" style="width: 100%; height: 250px;"></div>
        <div id="unavailable-table" class="table-container" style="margin-top: 16px;"></div>
    </div>

    <div class="card">
        <div class="tab-header">
            <button class="tab-btn active" data-tab="policy" onclick="switchTab('policy')">
                <svg class="tab-icon" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                下发策略用户清单
                <span class="tab-count">7</span>
            </button>
            <button class="tab-btn" data-tab="ping" onclick="switchTab('ping')">
                <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                按用户Ping域名不可达
                <span class="tab-count">7</span>
            </button>
        </div>
        <div class="tab-pane active" id="tab-policy">
            <div class="tab-search-bar">
                <div class="search-input">
                    <input type="text" placeholder="搜索账号">
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部地市</option>
                        <option value="changsha">长沙</option>
                        <option value="zhuzhou">株洲</option>
                        <option value="xiangtan">湘潭</option>
                        <option value="hengyang">衡阳</option>
                        <option value="shaoyang">邵阳</option>
                        <option value="yueyang">岳阳</option>
                        <option value="changde">常德</option>
                        <option value="zhangjiajie">张家界</option>
                    </select>
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部策略类型</option>
                        <option value="dns">DNS策略</option>
                        <option value="route">路由策略</option>
                        <option value="qos">QoS策略</option>
                    </select>
                </div>
            </div>
            <div id="policy-table" class="table-container"></div>
        </div>
        <div class="tab-pane" id="tab-ping">
            <div class="tab-search-bar">
                <div class="search-input">
                    <input type="text" placeholder="搜索账号">
                </div>
                <div class="search-input">
                    <select class="search-select">
                        <option value="">全部地市</option>
                        <option value="changsha">长沙</option>
                        <option value="zhuzhou">株洲</option>
                        <option value="xiangtan">湘潭</option>
                        <option value="hengyang">衡阳</option>
                        <option value="shaoyang">邵阳</option>
                        <option value="yueyang">岳阳</option>
                        <option value="changde">常德</option>
                        <option value="zhangjiajie">张家界</option>
                    </select>
                </div>
            </div>
            <div id="ping-table" class="table-container"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        var unavailableTrendChart = echarts.init(document.getElementById('unavailable-trend'));
        var trendOption = {
            backgroundColor: 'transparent',
            grid: { left: 60, right: 30, top: 30, bottom: 40 },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(10, 22, 40, 0.95)',
                borderColor: 'rgba(0, 212, 255, 0.3)',
                textStyle: { color: '#e8f4ff' }
            },
            legend: {
                data: ['中断用户数', '不可用时长(分钟)'],
                textStyle: { color: '#7aa2cc', fontSize: 11 },
                top: 0
            },
            xAxis: {
                type: 'category',
                data: ['06:00', '07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00', '23:00'],
                axisLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.2)' } },
                axisLabel: { color: '#4a6a8a', fontSize: 10 }
            },
            yAxis: [
                {
                    type: 'value',
                    name: '用户数',
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: { lineStyle: { color: 'rgba(0, 212, 255, 0.1)' } },
                    axisLabel: { color: '#4a6a8a', fontSize: 10 }
                },
                {
                    type: 'value',
                    name: '时长(分钟)',
                    axisLine: { show: false },
                    axisTick: { show: false },
                    splitLine: { show: false },
                    axisLabel: { color: '#4a6a8a', fontSize: 10 }
                }
            ],
            series: [
                {
                    name: '中断用户数',
                    type: 'line',
                    smooth: true,
                    itemStyle: { color: '#ff6b6b' },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(255, 107, 107, 0.3)' },
                            { offset: 1, color: 'rgba(255, 107, 107, 0.05)' }
                        ])
                    },
                    data: [12, 15, 18, 22, 19, 25, 28, 32, 29, 26, 24, 22, 20, 25, 30, 28, 22, 18]
                },
                {
                    name: '不可用时长(分钟)',
                    type: 'line',
                    yAxisIndex: 1,
                    smooth: true,
                    itemStyle: { color: '#ffd93d' },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(255, 217, 61, 0.3)' },
                            { offset: 1, color: 'rgba(255, 217, 61, 0.05)' }
                        ])
                    },
                    data: [180, 220, 280, 350, 290, 420, 480, 520, 450, 380, 320, 290, 260, 380, 520, 480, 350, 280]
                }
            ]
        };
        unavailableTrendChart.setOption(trendOption);

        window.addEventListener('resize', function() {
            unavailableTrendChart.resize();
        });

        const unavailableData = [
            { account: '18062790651', city: '长沙', startTime: '2026-05-31 14:23:15', endTime: '2026-05-31 15:47:32', duration: 84, reason: '线路中断' },
            { account: '07319541859', city: '株洲', startTime: '2026-05-31 13:05:42', endTime: '2026-05-31 13:52:18', duration: 46, reason: '设备重启' },
            { account: '17371214159', city: '湘潭', startTime: '2026-05-31 11:30:00', endTime: '2026-05-31 12:15:33', duration: 45, reason: '线路中断' },
            { account: '07349546950', city: '衡阳', startTime: '2026-05-31 10:12:28', endTime: '2026-05-31 11:05:50', duration: 53, reason: 'OLT故障' },
            { account: '18673153692', city: '岳阳', startTime: '2026-05-31 09:45:10', endTime: '2026-05-31 10:30:25', duration: 45, reason: '设备重启' },
            { account: '07386223005', city: '常德', startTime: '2026-05-31 08:20:33', endTime: '2026-05-31 09:15:47', duration: 55, reason: '线路中断' },
            { account: '18974327899', city: '张家界', startTime: '2026-05-31 07:55:00', endTime: '2026-05-31 08:42:15', duration: 47, reason: '设备重启' }
        ];

        const unavailableTable = new DataTable('unavailable-table', {
            minWidth: 900,
            pageSize: 5,
            columns: [
                { key: 'account', label: '账号', flex: 1.3, render: (val) => `<span style="font-family: 'JetBrains Mono', monospace;">${val}</span>` },
                { key: 'city', label: '地市', flex: 0.8 },
                { key: 'startTime', label: '中断开始时间', flex: 1.4 },
                { key: 'endTime', label: '中断结束时间', flex: 1.4 },
                { key: 'duration', label: '不可用时长(分钟)', flex: 1.2, render: (val) => `<span style="color: #ff6b6b; font-weight: 600;">${val}</span>` },
                { key: 'reason', label: '中断原因', flex: 1.0 }
            ],
            data: unavailableData
        });
        unavailableTable.render();

        const policyData = [
            { account: '18062790651', city: '长沙', policyType: 'DNS策略', policyContent: 'DNS优选', dispatchTime: '2026-05-30 10:00:00', status: '已生效' },
            { account: '07319541859', city: '株洲', policyType: '路由策略', policyContent: '路由优化', dispatchTime: '2026-05-30 11:30:00', status: '已生效' },
            { account: '17371214159', city: '湘潭', policyType: 'QoS策略', policyContent: '带宽保障', dispatchTime: '2026-05-30 14:15:00', status: '已生效' },
            { account: '07349546950', city: '衡阳', policyType: 'DNS策略', policyContent: 'DNS优选', dispatchTime: '2026-05-30 15:45:00', status: '已生效' },
            { account: '18673153692', city: '岳阳', policyType: '路由策略', policyContent: '路由优化', dispatchTime: '2026-05-30 16:20:00', status: '已生效' },
            { account: '07386223005', city: '常德', policyType: 'DNS策略', policyContent: 'DNS优选', dispatchTime: '2026-05-30 17:00:00', status: '已生效' },
            { account: '18974327899', city: '张家界', policyType: 'QoS策略', policyContent: '带宽保障', dispatchTime: '2026-05-30 18:30:00', status: '已生效' }
        ];

        const policyTable = new DataTable('policy-table', {
            minWidth: 1000,
            pageSize: 5,
            columns: [
                { key: 'account', label: '账号', flex: 1.3, render: (val) => `<span style="font-family: 'JetBrains Mono', monospace;">${val}</span>` },
                { key: 'city', label: '地市', flex: 0.8 },
                { key: 'policyType', label: '策略类型', flex: 1.0 },
                { key: 'policyContent', label: '策略内容', flex: 1.0 },
                { key: 'dispatchTime', label: '下发时间', flex: 1.4 },
                { key: 'status', label: '状态', flex: 0.8, render: (val) => `<span class="status-badge online"><span class="status-dot"></span>${val}</span>` }
            ],
            data: policyData
        });
        policyTable.render();

        const pingData = [
            { account: '18062790651', city: '长沙', domain: 'www.baidu.com', pingResult: '不可达', lastCheck: '2026-05-31 20:30:15', duration: 120 },
            { account: '07319541859', city: '株洲', domain: 'www.qq.com', pingResult: '不可达', lastCheck: '2026-05-31 20:28:42', duration: 85 },
            { account: '17371214159', city: '湘潭', domain: 'www.taobao.com', pingResult: '不可达', lastCheck: '2026-05-31 20:25:00', duration: 200 },
            { account: '07349546950', city: '衡阳', domain: 'www.jd.com', pingResult: '不可达', lastCheck: '2026-05-31 20:22:33', duration: 150 },
            { account: '18673153692', city: '岳阳', domain: 'www.baidu.com', pingResult: '不可达', lastCheck: '2026-05-31 20:20:10', duration: 95 },
            { account: '07386223005', city: '常德', domain: 'www.163.com', pingResult: '不可达', lastCheck: '2026-05-31 20:18:45', duration: 110 },
            { account: '18974327899', city: '张家界', domain: 'www.sina.com', pingResult: '不可达', lastCheck: '2026-05-31 20:15:22', duration: 180 }
        ];

        const pingTable = new DataTable('ping-table', {
            minWidth: 900,
            pageSize: 5,
            columns: [
                { key: 'account', label: '账号', flex: 1.3, render: (val) => `<span style="font-family: 'JetBrains Mono', monospace;">${val}</span>` },
                { key: 'city', label: '地市', flex: 0.8 },
                { key: 'domain', label: 'Ping域名', flex: 1.2 },
                { key: 'pingResult', label: 'Ping结果', flex: 0.9, render: (val) => `<span class="status-badge offline"><span class="status-dot"></span>${val}</span>` },
                { key: 'lastCheck', label: '最后检测时间', flex: 1.4 },
                { key: 'duration', label: '持续时长(秒)', flex: 1.0, render: (val) => `<span style="color: #ffd93d; font-weight: 600;">${val}</span>` }
            ],
            data: pingData
        });
        pingTable.render();
    </script>
</body>
</html>
